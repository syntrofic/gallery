[package]
name = "gallery"
version = "0.2.6"
edition = "2021"
description = "Personal self-hosted gallery backend"
license = "MIT"
default-run = "gallery"

[dependencies]
age = { version = "0.11", features = ["armor"] }
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
futures-util = "0.3"
hex = "0.4"
http = "1"
libc = "0.2"
http-body-util = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "json"] }
subtle = "2"
tempfile = "3"
thiserror = "2"
tiff = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "limit", "util", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
axum = { version = "0.8", features = ["macros"] }
http-body-util = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }

[profile.dev]
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1
