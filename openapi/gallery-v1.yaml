openapi: 3.1.0
info:
  title: Gallery API
  version: 0.1.0
  description: |
    Business paths are under /api/v1. Health checks are at the server root.
    Design documents write action suffixes with a colon. The server accepts that
    form and rewrites each colon to a slash before routing.
servers:
- url: "/api/v1"
paths:
  "/setup/status":
    get:
      operationId: setup_status
      summary: Owner initialization flag
      security: []
      responses:
        '200':
          description: Owner initialization flag
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Initialized"
        default:
          "$ref": "#/components/responses/GalleryProblem"
  "/setup/owner":
    post:
      operationId: setup_owner
      summary: Owner created, no session issued
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SetupOwner"
      responses:
        '201':
          description: Owner created, no session issued
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Initialized"
        default:
          "$ref": "#/components/responses/GalleryProblem"
  "/session":
    get:
      operationId: get_session
      summary: Anonymous or authenticated session
      security:
      - {}
      - GallerySession: []
      responses:
        '200':
          description: Anonymous or authenticated session
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
        default:
          "$ref": "#/components/responses/GalleryProblem"
    post:
      operationId: login
      summary: Logged in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Login"
      responses:
        '201':
          description: Logged in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthenticatedSession"
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          "$ref": "#/components/responses/GalleryProblem"
    delete:
      operationId: logout
      summary: Logged out
      parameters:
      - "$ref": "#/components/parameters/XCSRFToken"
      responses:
        '204':
          description: Logged out
        default:
          "$ref": "#/components/responses/GalleryProblem"
  "/admin/account/password":
    patch:
      operationId: admin_password
      summary: Owner password changed and sessions revoked
      parameters:
      - "$ref": "#/components/parameters/XCSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PasswordChange"
      responses:
        '204':
          description: Owner password changed and sessions revoked
        default:
          "$ref": "#/components/responses/GalleryProblem"
  "/account/password":
    patch:
      operationId: account_password
      summary: Current account password changed
      parameters:
      - "$ref": "#/components/parameters/XCSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PasswordChange"
      responses:
        '204':
          description: Current account password changed
        default:
          "$ref": "#/components/responses/GalleryProblem"
  "/admin/users":
    get:
      operationId: list_users
      summary: Local accounts
      responses:
        '200':
          description: Local accounts
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LocalAccounts"
        default:
          "$ref": "#/components/responses/GalleryProblem"
    post:
      operationId: create_user
      summary: Collaborator created
      parameters:
      - "$ref": "#/components/parameters/XCSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Login"
      responses:
        '201':
          description: Collaborator created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LocalAccount"
        default:
          "$ref": "#/components/responses/GalleryProblem"
  "/admin/users/{user_id}":
    parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    patch:
      operationId: patch_user
      summary: Account enabled or disabled
      parameters:
      - "$ref": "#/components/parameters/XCSRFToken"
      - "$ref": "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AccountPatch"
      responses:
        '200':
          description: Account enabled or disabled
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LocalAccount"
        default:
          "$ref": "#/components/responses/GalleryProblem"
  "/admin/users/{user_id}/reset-password":
    parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    post:
      operationId: reset_password
      summary: Password reset and sessions revoked
      parameters:
      - "$ref": "#/components/parameters/XCSRFToken"
      - "$ref": "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PasswordReset"
      responses:
        '204':
          description: Password reset and sessions revoked
        default:
          "$ref": "#/components/responses/GalleryProblem"
  "/admin/settings":
    get:
      operationId: admin_settings
      summary: Desensitized settings
      responses:
        '200':
          description: Desensitized settings
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Settings"
        default:
          "$ref": "#/components/responses/GalleryProblem"
  "/admin/settings/{section}":
    parameters:
    - name: section
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    patch:
      operationId: patch_settings
      summary: Settings section updated
      parameters:
      - "$ref": "#/components/parameters/XCSRFToken"
      - "$ref": "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SettingsPatch"
      responses:
        '200':
          description: Settings section updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Settings"
        default:
          "$ref": "#/components/responses/GalleryProblem"
  "/admin/runs/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    get:
      operationId: admin_run
      summary: Maintenance run summary
      responses:
        '200':
          description: Maintenance run summary
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MaintenanceRun"
        default:
          "$ref": "#/components/responses/GalleryProblem"
  "/admin/audit":
    get:
      operationId: admin_audit
      summary: Owner audit records
      responses:
        '200':
          description: Owner audit records
          content:
            application/json:
              schema:
