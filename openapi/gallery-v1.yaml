        minLength: 1
    post:
      operationId: abort_backup
      summary: Abort backup
      parameters:
      - "$ref": "#/components/parameters/XCSRFToken"
      responses:
        '200':
          description: Abort backup
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Backup"
        default:
