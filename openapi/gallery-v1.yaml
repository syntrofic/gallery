          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Backups"
        default:
          "$ref": "#/components/responses/GalleryProblem"
    post:
      operationId: create_backup
      summary: Backup accepted
      parameters:
      - "$ref": "#/components/parameters/XCSRFToken"
      - "$ref": "#/components/parameters/IdempotencyKey"
      - name: dry_run
        in: query
        required: false
        schema:
          type: boolean
      - name: backup_repository_id
        in: query
        required: false
        schema:
          type: string
      responses:
        '202':
          description: Backup accepted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Backup"
        '200':
          description: Create backup
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BackupPreview"
        default:
          "$ref": "#/components/responses/GalleryProblem"
  "/admin/backups/{id}":
