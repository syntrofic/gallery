          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestoreGap"
        default:
          "$ref": "#/components/responses/GalleryProblem"
  "/admin/restores/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    get:
      operationId: get_restore
      summary: Get restore
      responses:
        '200':
          description: Get restore
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Restore"
        default:
