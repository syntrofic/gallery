          minLength: 1
        state:
          type: string
        branch_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        snapshot_at:
          anyOf:
          - type: integer
          - type: 'null'
        job_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
