components:
  securitySchemes:
    GallerySession:
      type: apiKey
      in: cookie
      name: gallery_session
  responses:
    GalleryProblem:
      description: Gallery error
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        request_id:
          type: string
        retryable:
          type: boolean
        refresh:
          type: boolean
        retry_after_ms:
          type: integer
      required:
      - type
      - title
      - status
      - detail
      - code
      - request_id
      - retryable
    Initialized:
      type: object
      properties:
        initialized:
          type: boolean
      required:
      - initialized
    SetupOwner:
      type: object
      properties:
        bootstrap_token:
          type: string
        username:
          type: string
        password:
          type: string
      required:
      - bootstrap_token
      - password
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
      - username
      - password
    PasswordChange:
      type: object
      properties:
        current_password:
          type: string
        new_password:
          type: string
        confirm_password:
          type: string
      required:
      - current_password
      - new_password
    Actor:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        username:
          type: string
        role:
          type: string
          enum:
          - owner
          - collaborator
        must_change_password:
          type: boolean
      required:
      - id
      - username
      - role
      - must_change_password
    AnonymousSession:
      type: object
      properties:
        actor:
          type: 'null'
      required:
      - actor
    AuthenticatedSession:
      type: object
      properties:
        actor:
          "$ref": "#/components/schemas/Actor"
        capability_revision:
          type: integer
        expires_at:
          type: string
          format: date-time
        csrf_token:
          type: string
        event_cursor:
          type: integer
      required:
      - actor
      - capability_revision
      - expires_at
      - csrf_token
      - event_cursor
    Session:
      oneOf:
      - "$ref": "#/components/schemas/AnonymousSession"
      - "$ref": "#/components/schemas/AuthenticatedSession"
    LocalAccount:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        username:
          type: string
        role:
          type: string
          enum:
          - owner
          - collaborator
        active:
          type: boolean
        status:
          type: string
        revision:
          type: integer
        must_change_password:
          type: boolean
      required:
      - id
      - username
      - revision
    LocalAccounts:
      type: object
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/LocalAccount"
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
    AccountPatch:
      type: object
      properties:
        expected_revision:
          type: integer
        status:
          type: string
          enum:
          - active
          - disabled
    PasswordReset:
      type: object
      properties:
        password:
          type: string
        expected_revision:
          type: integer
      required:
      - password
    Limits:
      type: object
      properties:
        max_upload_items:
          type: integer
        upload_concurrency_hint:
          type: integer
        max_download_selection:
          type: integer
        library_bytes:
          type: integer
        source:
          type: string
        writable:
          type: boolean
        staging_bytes:
          type: integer
        ai_daily_token_budget:
          type: integer
    Settings:
      type: object
      properties:
        revision:
          type: integer
        limits:
          "$ref": "#/components/schemas/Limits"
        ai_enabled:
          type: boolean
        ai_daily_token_budget:
          type: integer
    SettingsPatch:
      type: object
      properties:
        expected_revision:
          type: integer
        max_upload_items:
          type: integer
        upload_concurrency_hint:
          type: integer
        max_download_selection:
          type: integer
        ai_daily_token_budget:
          type: integer
    JobPause:
      type: object
      properties:
        kind:
          type: string
        reason:
          type: string
      required:
      - kind
      - reason
    StorageCapabilities:
      type: object
      properties:
        range:
          type: boolean
        conditional_put:
          type: boolean
        checksum:
          type: boolean
        move_object:
          type: boolean
    Progress:
