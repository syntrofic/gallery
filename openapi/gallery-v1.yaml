        snapshot_age_ms:
          anyOf:
          - type: integer
          - type: 'null'
        rpo_ms:
          type: integer
        rpo_exceeded:
          type: boolean
        success_rate:
          type: number
        failures:
          type: integer
        pins_held:
          type: integer
        last_drill_at:
