        running:
          type: integer
        pending:
          type: integer
        oldest_age_ms:
          type: integer
        execution_ms:
          type: object
        suppressed:
          type: boolean
        pauses:
          type: array
          items:
            "$ref": "#/components/schemas/JobPause"
        recent_failures:
          type: array
          items:
            type: object
    Accepted:
