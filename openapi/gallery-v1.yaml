          type: string
          minLength: 1
        kind:
          type: string
        state:
          type: string
          enum:
          - queued
          - running
          - retry_wait
          - cancel_requested
          - succeeded
          - failed
          - canceled
        status_url:
          type: string
        progress:
          "$ref": "#/components/schemas/Progress"
        failure:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - id
      - kind
      - state
      - status_url
      - progress
    Jobs:
      type: object
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Job"
