        default:
          "$ref": "#/components/responses/GalleryProblem"
  "/admin/search/rebuild":
    post:
      operationId: rebuild_search
      summary: Search index rebuild accepted
      parameters:
      - "$ref": "#/components/parameters/XCSRFToken"
      responses:
